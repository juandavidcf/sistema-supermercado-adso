<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de Productos</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color:#f4f4f4;
            margin:0;
        }

        header{
            background:#28a745;
            color:white;
            text-align:center;
            padding:20px;
        }

        nav{
            background:#333;
            padding:10px;
            text-align:center;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:15px;
            font-weight:bold;
        }

        .contenedor{
            width:90%;
            margin:30px auto;
        }

        h2{
            text-align:center;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        th{
            background:#28a745;
            color:white;
            padding:12px;
        }

        td{
            padding:10px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        tr:hover{
            background:#f1f1f1;
        }

        .btn{
            display:inline-block;
            margin-top:20px;
            padding:10px 20px;
            background:#28a745;
            color:white;
            text-decoration:none;
            border-radius:5px;
        }
    </style>
</head>
<body>

<header>
    <h1>Sistema de Gestión de Supermercado</h1>
</header>

<nav>
    <a href="/">Inicio</a>
    <a href="/productos/">Productos</a>
</nav>

<div class="contenedor">

    <h2>Inventario de Productos</h2>

    <table>
        <tr>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Cantidad</th>
        </tr>

        {% for producto in productos %}
        <tr>
            <td>{{ producto.nombre }}</td>
            <td>${{ producto.precio }}</td>
            <td>{{ producto.cantidad }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">No hay productos registrados.</td>
        </tr>
        {% endfor %}
    </table>

    <a class="btn" href="/">Volver al inicio</a>

</div>

</body>
</html>
